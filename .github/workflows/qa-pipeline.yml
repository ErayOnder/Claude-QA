# Runs with ANTHROPIC_API_KEY only — no Claude Code GitHub App required.
# For 3 visible steps we use the Claude Code CLI directly instead of the action.

name: Claude QA Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  qa-pipeline:
    name: QA Pipeline
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 30

    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check for API key
        id: check_api_key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ANTHROPIC_API_KEY is not set. Skipping QA pipeline."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check_api_key.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check_api_key.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI and jq
        if: steps.check_api_key.outputs.skip != 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          sudo apt-get update && sudo apt-get install -y jq

      - name: Install Playwright
        if: steps.check_api_key.outputs.skip != 'true'
        run: |
          npm install -g @playwright/test
          npx playwright install chromium --with-deps

      - name: Create output directories
        if: steps.check_api_key.outputs.skip != 'true'
        run: mkdir -p .claude-qa-output/screenshots

      - name: Configure Claude Code permissions
        if: steps.check_api_key.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/.claude
          cat > $HOME/.claude/settings.json << 'EOF'
          {
            "permissions": {
              "allow": [
                "Bash(gh *)",
                "Bash(cat *)",
                "Bash(node *)",
                "Bash(npx *)",
                "Bash(npm *)",
                "Bash(find *)",
                "Bash(grep *)",
                "Bash(mkdir *)",
                "Bash(cp *)",
                "Bash(ls *)",
                "Bash(echo *)",
                "Bash(test *)",
                "Bash(sleep *)",
                "Bash(wc *)",
                "Read",
                "Write",
                "Glob",
                "Grep"
              ],
              "deny": [
                "Bash(rm -rf *)",
                "Bash(sudo *)",
                "Write(**/.env*)",
                "Write(**/.ssh/**)"
              ]
            }
          }
          EOF

      # ── Step 1: Analyze PR ────────────────────────────────
      - name: "Step 1/3: Analyze PR"
        if: steps.check_api_key.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print \
            --max-turns 25 \
            --allowedTools "Bash(gh *),Bash(cat *),Bash(find *),Bash(grep *),Bash(mkdir *),Bash(echo *),Read,Write,Glob,Grep" <<PROMPT
          Run the analyzer agent on PR #$PR_NUMBER.
          Config: qa.config.yml
          Save the analysis JSON to .claude-qa-output/analysis.json
          PROMPT

      # ── Step 2: Execute Tests ─────────────────────────────
      - name: "Step 2/3: Execute Tests"
        if: steps.check_api_key.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QA_USERNAME: ${{ secrets.QA_USERNAME }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: |
          claude --print \
            --max-turns 40 \
            --allowedTools "Bash(node *),Bash(npx *),Bash(npm *),Bash(cat *),Bash(find *),Bash(mkdir *),Bash(echo *),Bash(test *),Bash(sleep *),Read,Write,Glob" <<PROMPT
          Run the executor agent using the analysis at .claude-qa-output/analysis.json.
          Config: qa.config.yml
          Screenshots dir: .claude-qa-output/screenshots/
          Save results to: .claude-qa-output/results.json
          PROMPT

      # ── Step 3: Generate and Post Report ───────────────────
      - name: "Step 3/3: Report"
        if: steps.check_api_key.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --print \
            --max-turns 10 \
            --allowedTools "Bash(gh pr comment *),Bash(cat *),Bash(echo *),Read,Write" <<PROMPT
          Run the reporter agent to generate the final QA report.
          Analysis: .claude-qa-output/analysis.json
          Results: .claude-qa-output/results.json
          PR Number: $PR_NUMBER
          Save the markdown report to: .claude-qa-output/report.md
          Then post it as a PR comment: gh pr comment $PR_NUMBER --body-file .claude-qa-output/report.md
          PROMPT

      - name: Post report to PR
        if: steps.check_api_key.outputs.skip != 'true' && success()
        run: |
          if [ -f .claude-qa-output/report.md ]; then
            gh pr comment "$PR_NUMBER" --body-file .claude-qa-output/report.md
            echo "Report posted to PR #$PR_NUMBER"
          fi

      - name: QA skipped — API key not set
        if: steps.check_api_key.outputs.skip == 'true'
        run: |
          echo "Claude-QA pipeline skipped: ANTHROPIC_API_KEY is not set in repository secrets."
          echo "Add it in Settings → Secrets and variables → Actions to enable the pipeline."

      # ── Upload Artifacts ──────────────────────────────────
      - name: Upload QA artifacts
        if: steps.check_api_key.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-pr${{ env.PR_NUMBER }}-${{ github.run_number }}
          path: .claude-qa-output/
          retention-days: 14
          if-no-files-found: warn
